[project]
name = "tracklab"
version = "0.1.0"
description = "Video motion tracking & measurement — a friendlier Kinovea"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "opencv-contrib-python-headless>=5.0.0.93",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.2",
    "scipy>=1.18.1",
]

[project.scripts]
tracklab = "tracklab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
